name: Release

# Crée une Release BROUILLON à chaque tag vX.Y.Z (docs/claude/packaging.md),
# avec R36S-Studio-Setup.exe -- WINDOWS UNIQUEMENT pour l'instant : la
# publication n'attend que le job Windows. macOS et Linux sont toujours
# construits (retour de CI) mais ne bloquent pas et ne sont pas joints ;
# ils rejoindront la Release quand leurs constructions passeront.
# Ces installeurs sont vendus sur la boutique : scripts/publish_release.sh
# les retire avant de publier la Release (code et notes seulement).
# Aucun secret : seul GITHUB_TOKEN (fourni par GitHub) est utilisé.
# La Release est créée en BROUILLON. Les artefacts Actions ne servent qu'à
# passer les fichiers entre jobs (rétention 1 jour) : sur un dépôt public,
# tout compte GitHub connecté peut les télécharger -- jamais un canal de
# diffusion.
#
# Deux déclencheurs : un tag v* poussé à la main, ou un push sur main qui
# change APP_VERSION (r36s_studio/__init__.py) -- dans ce cas le tag
# v<APP_VERSION> est créé à la publication du brouillon. Si ce tag ou une
# Release (même brouillon) de ce nom existe déjà, rien n'est construit.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "r36s_studio/__init__.py"
      - ".github/workflows/release.yml"

jobs:
  version:
    name: Tag = APP_VERSION
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.v.outputs.app_version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION=$(python3 -c "import r36s_studio; print(r36s_studio.APP_VERSION)")
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à APP_VERSION ($APP_VERSION, r36s_studio/__init__.py)"
              exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v$APP_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null \
             || gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG existe déjà (tag ou Release) : rien à construire. Change APP_VERSION pour une nouvelle version."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows (installeur)
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Construire l'application (PyInstaller)
        shell: pwsh
        run: packaging/build_windows.ps1

      - name: Construire l'installeur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DAppVersion=${{ needs.version.outputs.app_version }}" packaging\windows_installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Test de fumée : installation silencieuse comme le ferait un
      # utilisateur, puis lancement de l'exe installé avec --version (quitte
      # aussitôt). Échoue si l'exe ne démarre pas (DLL ou fichier manquant).
      - name: Tester l'installation
        shell: pwsh
        run: |
          $setup = Start-Process dist\R36S-Studio-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installation : code $($setup.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\R36S Studio\R36S Studio.exe"
          if (-not (Test-Path $exe)) { throw "Introuvable apres installation : $exe" }
          # Dossier complet : un exe sans _internal donne « Failed to load
          # Python DLL » au lancement (signalé par un testeur).
          $internal = Join-Path (Split-Path $exe) '_internal'
          if (-not (Test-Path $internal)) { throw "Dossier _internal absent : $internal" }
          # python3XX.dll (l'interpreteur), pas python3.dll (simple redirection).
          $dll = Get-ChildItem $internal -Filter 'python3*.dll' | Where-Object { $_.Name -match '^python3\d+\.dll$' } | Select-Object -First 1
          if (-not $dll) { throw "DLL Python absente de $internal" }
          Write-Host "Installe : $exe + _internal ($((Get-ChildItem $internal -Recurse -File).Count) fichiers, $($dll.Name))"
          $run = Start-Process $exe -ArgumentList '--version' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "--version : code $($run.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/R36S-Studio-Setup.exe
          retention-days: 1

  # Pas encore joint à la Release (publish n'attend que Windows).
  macos:
    name: macOS (.dmg)
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Construire l'image disque
        run: packaging/build_macos.sh dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/R36S-Studio-macOS.dmg
          retention-days: 1

  # ponytail: .tar.gz du dossier onedir, AppImage quand une entrée .desktop
  # existera. Pas encore joint à la Release (publish n'attend que Windows).
  linux:
    name: Linux (.tar.gz)
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Construire l'application
        run: packaging/build_linux.sh
      - name: Empaqueter
        run: |
          cp LICENSE "dist/R36S Studio/LICENSE.txt"
          cp THIRD_PARTY_NOTICES.txt "dist/R36S Studio/"
          tar -C dist -czf R36S-Studio-Linux.tar.gz "R36S Studio"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: R36S-Studio-Linux.tar.gz
          retention-days: 1

  publish:
    name: Publier la Release
    # Windows seul : macOS et Linux échouent encore et bloquaient toute
    # publication. Les rajouter ici (needs + download) quand ils passeront.
    needs: [version, windows]
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && needs.windows.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts/windows
      - uses: softprops/action-gh-release@v2
        with:
          # Brouillon : visible des seuls membres du dépôt. Publié par
          # scripts/publish_release.sh, après retrait des fichiers ; la
          # vérification des mises à jour de l'app ne voit que les publiées.
          draft: true
          tag_name: v${{ needs.version.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          name: R36S Studio v${{ needs.version.outputs.app_version }} (Windows)
          body_path: packaging/RELEASE_NOTES.md
          files: artifacts/windows/R36S-Studio-Setup.exe
          fail_on_unmatched_files: true
