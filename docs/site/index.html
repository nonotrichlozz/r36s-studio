  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1d2330; --muted: #5b6475; --accent: #1a9bb0; }

<body>
  <main>
    <h1>R36S Studio</h1>
    <p class="soon"><a href="https://github.com/nonotrichlozz/r36s-studio/releases/latest">Télécharger la dernière version</a></p>

    <p>Windows, Mac et Linux.</p>
  </main>
