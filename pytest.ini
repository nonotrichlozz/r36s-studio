[pytest]
addopts = --strict-markers
markers =
    real_subprocess: autorise ce test à invoquer un vrai sous-processus (subprocess.run/Popen non mocké). Réservé aux rares tests qui doivent réellement lancer une commande -- voir le garde-fou global dans tests/conftest.py.
    real_fda_probe: laisse `gui.elevate.has_full_disk_access` s'exécuter réellement (non stubbée à True). Réservé aux tests qui testent cette fonction elle-même -- voir le garde-fou global dans tests/conftest.py.
    real_consoles_diverses_log_path: laisse `gui.logs.consoles_diverses_log_path` s'exécuter réellement (non redirigée vers un fichier temporaire). Réservé aux tests qui testent cette fonction elle-même -- voir le garde-fou global dans tests/conftest.py.
