name: Page GitHub Pages

# Publie docs/site/ (et seulement lui) sur https://nonotrichlozz.github.io/r36s-studio/,
# adresse de update_check.STORE_URL. Réglage du dépôt requis une fois :
# Settings > Pages > Build and deployment > Source : « GitHub Actions ».
on:
  push:
    branches: [main]
    paths: ["docs/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
