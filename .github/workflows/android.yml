name: Android

# Application Android (android-app/) : tests du coeur (faux lecteur USB,
# flash, sauvegarde, table de partitions) puis construction de l'APK.
# L'APK est a telecharger dans l'onglet Actions (artefact "R36S-Studio-Android").
on:
  push:
    branches: [main, android-app]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
      - "r36s_studio/__init__.py"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# contents: write uniquement pour deposer l'APK sur la branche apk-test.
permissions:
  contents: write

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lancer les tests du coeur
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Construire l'APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: R36S-Studio-Android
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Branche de depot (un seul commit, ecrase a chaque fois) : permet de
      # recuperer l'APK par git, sans passer par la page des artefacts.
      - name: Deposer l'APK sur la branche apk-test
        if: github.ref == 'refs/heads/android-app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/R36S-Studio-Android.apk"
          cd "$RUNNER_TEMP/apk"
          git init -q -b apk-test
          git add R36S-Studio-Android.apk
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "APK de test (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-test
